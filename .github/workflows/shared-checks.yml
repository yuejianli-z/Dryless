name: Shared feature checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Qt geometry dependency
        run: python -m pip install PyQt6==6.11.0
      - name: Shared data, graph-label and microbreak contract (no hardware)
        run: python -m unittest discover -s tests -v
